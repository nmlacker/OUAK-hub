<script>
(async function () {
  const files = { api: "docs/api.md", modmenu: "docs/modmenu.md", multiplayer: "docs/multiplayer.md", songselector: "docs/songselector.md", dashbar: "docs/dashbar.md" };
  // Links between the READMEs, as the source tree names them, open here instead.
  const links = { "README.md": "api", "../README.md": "api", "OUAKModMenu/README.md": "modmenu", "OUAKMultiplayer/README.md": "multiplayer", "OUAKSongSelector/README.md": "songselector", "OUAKDashBar/README.md": "dashbar" };
  const key = new URLSearchParams(location.search).get("doc") || "api";
  const name = files[key] ? key : "api";
  document.querySelectorAll("#docnav a").forEach(a => a.classList.toggle("active", a.dataset.doc === name));
  const out = document.getElementById("doc");
  try {
    const r = await fetch(files[name]);
    if (!r.ok) throw new Error(r.status);
    out.innerHTML = DOMPurify.sanitize(marked.parse(await r.text()));
    out.querySelectorAll("a[href]").forEach(a => {
      const h = a.getAttribute("href");
      if (links[h]) a.setAttribute("href", "docs.html?doc=" + links[h]);
    });
    const h1 = out.querySelector("h1");
    if (h1) document.title = h1.textContent + " · OUAK Mods";
  } catch (e) {
    out.textContent = "This document couldn't be loaded.";
  }
})();
</script>
